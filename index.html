<style>
@font-face{font-family:'FGDisplay';src:url('./font/FuncGinesSansEvoBold.ttf') format('truetype');font-weight:700;font-display:swap;}
@font-face{font-family:'FGDisplay';src:url('./font/FuncGinesSansEvoMedium.ttf') format('truetype');font-weight:500;font-display:swap;}
@font-face{font-family:'FGThai';src:url('./font/NotoSansThaiUI-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'FGThai';src:url('./font/NotoSansThaiUI-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
@font-face{font-family:'FGThaiBody';src:url('./font/NotoSansThai-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}
@font-face{font-family:'FGThaiBody';src:url('./font/NotoSansThai-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
@font-face{font-family:'FGMono';src:url('./font/SourceSansProBlack.ttf') format('truetype');font-weight:900;font-display:swap;}

:root{
  --sky-0:#ffffff;
  --sky-50:#f3f9ff;
  --sky-100:#e6f2fd;
  --sky-200:#d3e9fb;
  --sky-300:#aed4f6;
  --accent-400:#6db4ec;
  --accent-500:#3f97e3;
  --accent-600:#2c78c0;
  --accent-700:#1f5c99;
  --ink-900:#132234;
  --ink-700:#375069;
  --ink-500:#6f889f;
  --ink-400:#89a0b5;
  --ink-300:#a9bccd;
  --border:#dbeaf8;
  --danger:#e2584f;
  --good:#37b783;
  --r-xl:26px;
  --r-lg:20px;
  --r-md:14px;
  --r-sm:9px;
  --shadow-1:0 10px 30px -12px rgba(41,110,175,.22);
  --shadow-2:0 4px 16px -6px rgba(41,110,175,.18);
  --ease:cubic-bezier(.22,.9,.32,1);
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Segoe UI Symbol','Noto Color Emoji';
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'FGDisplay','FGThaiBody','FGThai',sans-serif,var(--emoji);
  font-variant-emoji:emoji;
  background:var(--sky-50);
  color:var(--ink-900);
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  overscroll-behavior:none;
}
.selectable{user-select:text;-webkit-user-select:text;}
.bubble,.bubble *,.codeblock,.codeblock *,#msgInput{user-select:text;-webkit-user-select:text;}
img{-webkit-user-drag:none;user-drag:none;pointer-events:auto;}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
input,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--sky-300);border-radius:99px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex;height:100vh;height:100dvh;width:100vw;position:relative;}

#sidebar{
  width:288px;flex:0 0 288px;background:linear-gradient(180deg,var(--sky-0),var(--sky-50));
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  transition:transform .38s var(--ease),box-shadow .38s var(--ease);
  z-index:40;position:relative;
}
#sidebar .side-head{padding:20px 18px 10px;display:flex;align-items:center;gap:10px;}
#sidebar .brand-mark{width:34px;height:34px;flex:0 0 34px;filter:drop-shadow(0 4px 10px rgba(63,151,227,.35));}
#sidebar .brand-text{font-weight:700;font-size:19px;letter-spacing:.2px;color:var(--ink-900);}
#sidebar .brand-sub{font-size:11px;color:var(--ink-500);font-family:'FGThai';margin-top:-2px;}
#newChatBtn{
  margin:14px 16px 8px;padding:12px 14px;border-radius:var(--r-md);
  background:linear-gradient(135deg,var(--accent-400),var(--accent-600));
  color:#fff;display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;
  box-shadow:var(--shadow-2);transition:transform .18s var(--ease),box-shadow .18s var(--ease),opacity .2s;
}
#newChatBtn:active{transform:scale(.97);}
#newChatBtn.locked{opacity:.55;}
#newChatBtn.locked:active{transform:none;}
#newChatBtn svg{width:16px;height:16px;}
#chatList{flex:1;overflow-y:auto;padding:6px 10px 10px;display:flex;flex-direction:column;gap:3px;}
.chat-item{
  display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:var(--r-sm);
  font-size:13.5px;color:var(--ink-700);cursor:pointer;position:relative;
  transition:background .18s var(--ease);font-family:'FGThai';
}
.chat-item:hover{background:var(--sky-100);}
.chat-item.active{background:var(--sky-100);color:var(--accent-700);font-weight:700;}
.chat-item .ci-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-item .ci-del{opacity:0;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:8px;flex:0 0 26px;}
.chat-item:hover .ci-del{opacity:.6;}
.chat-item .ci-del:hover{opacity:1 !important;background:#fde4e2;}
.chat-item .ci-del svg{width:13px;height:13px;color:var(--danger);}
.chat-item svg.ci-icon{width:15px;height:15px;flex:0 0 15px;color:var(--ink-400);}
#sideFoot{padding:12px 14px 16px;border-top:1px solid var(--border);display:flex;gap:8px;}
.foot-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:var(--r-sm);font-size:10.5px;color:var(--ink-500);font-family:'FGThai';transition:background .18s;}
.foot-btn:hover{background:var(--sky-100);color:var(--accent-700);}
.foot-btn svg{width:17px;height:17px;}

#sidebarScrim{position:fixed;inset:0;background:rgba(15,35,55,.28);backdrop-filter:blur(2px);z-index:35;opacity:0;pointer-events:none;transition:opacity .3s;}

#main{flex:1;display:flex;flex-direction:column;position:relative;min-width:0;}

#bgSky{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
#bgSky img{position:absolute;top:-6%;right:-5%;height:132%;min-height:100%;width:auto;max-width:none;opacity:.24;filter:saturate(1.08);animation:skyDrift 48s ease-in-out infinite alternate;}
#bgSky img.sky-b{top:auto;bottom:-10%;right:auto;left:-8%;height:90%;opacity:.14;animation-duration:64s;animation-direction:alternate-reverse;}
#bgSky::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.9) 55%,#fff 100%);}
@keyframes skyDrift{from{transform:translate(0,0) scale(1);}to{transform:translate(-2.5%,1.5%) scale(1.03);}}

#topbar{
  height:60px;flex:0 0 60px;display:flex;align-items:center;gap:12px;padding:0 18px;
  position:relative;z-index:5;border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(1.4);
}
#menuBtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--ink-700);}
#menuBtn:hover{background:var(--sky-100);}
#menuBtn svg{width:19px;height:19px;}
.top-title{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
.top-title img{width:26px;height:26px;}
.top-title .tt-text{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#soundBtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--ink-500);}
#soundBtn:hover{background:var(--sky-100);}
#soundBtn svg{width:18px;height:18px;}

#scrollArea{flex:1;overflow-y:auto;position:relative;z-index:2;scroll-behavior:smooth;}
#msgWrap{max-width:760px;margin:0 auto;padding:26px 18px 130px;display:flex;flex-direction:column;gap:22px;min-height:100%;}

#emptyState{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;}
#emptyState .es-cloud{width:92px;height:92px;filter:drop-shadow(0 12px 24px rgba(63,151,227,.3));animation:float 4.5s ease-in-out infinite;}
#emptyState h1{font-size:23px;font-weight:700;color:var(--ink-900);}
#emptyState p{font-size:13.5px;color:var(--ink-500);font-family:'FGThai';max-width:340px;line-height:1.7;}
.suggest-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px;max-width:460px;width:100%;}
.suggest-card{
  text-align:left;padding:12px 13px;border-radius:var(--r-md);background:#fff;border:1px solid var(--border);
  font-size:12.5px;color:var(--ink-700);font-family:'FGThai';box-shadow:var(--shadow-2);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s;
  animation:pop .3s var(--ease) both;
}
.suggest-card:active{transform:scale(.97);}
.suggest-card b{display:block;font-family:'FGDisplay';color:var(--ink-900);font-size:13px;margin-bottom:2px;font-weight:700;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

.row{display:flex;gap:11px;align-items:flex-end;position:relative;}
.row.user{flex-direction:row-reverse;}
.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:10px;overflow:hidden;background:var(--sky-100);display:flex;align-items:center;justify-content:center;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar.user-av{background:linear-gradient(135deg,var(--accent-400),var(--accent-700));color:#fff;font-weight:700;font-size:12px;}

.bubble-col{display:flex;flex-direction:column;gap:6px;max-width:78%;position:relative;}
.row.user .bubble-col{align-items:flex-end;}

.bubble{
  padding:12px 15px;border-radius:var(--r-lg);font-size:14.5px;line-height:1.68;position:relative;
  font-family:'FGThaiBody','FGThai',sans-serif,var(--emoji);word-wrap:break-word;
  animation:pop .32s var(--ease);
}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.row.user .bubble{
  background:linear-gradient(135deg,var(--accent-400),var(--accent-600));color:#fff;
  border-bottom-right-radius:6px;box-shadow:var(--shadow-2);
}
.row.assistant .bubble{
  background:rgba(255,255,255,.92);border:1px solid var(--border);color:var(--ink-900);
  border-bottom-left-radius:6px;box-shadow:var(--shadow-2);backdrop-filter:blur(8px);
}
.bubble.pressed{outline:2px solid var(--accent-400);outline-offset:2px;}
.bubble p{margin:0 0 8px;}
.bubble p:last-child{margin-bottom:0;}
.bubble ul,.bubble ol{margin:6px 0 8px 20px;}
.bubble li{margin-bottom:4px;}
.bubble a{color:inherit;text-decoration:underline;text-decoration-color:currentColor;opacity:.9;}
.bubble strong{font-family:'FGDisplay';font-weight:700;}
.bubble del{opacity:.6;}
.bubble hr{border:none;border-top:1px solid var(--border);margin:12px 0;}
.bubble h1,.bubble h2,.bubble h3,.bubble h4,.bubble h5{font-family:'FGDisplay';font-weight:700;line-height:1.35;margin:10px 0 6px;}
.bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child,.bubble h4:first-child,.bubble h5:first-child{margin-top:0;}
.bubble h1{font-size:19px;}
.bubble h2{font-size:17px;}
.bubble h3{font-size:15.5px;}
.bubble h4,.bubble h5{font-size:14.5px;}
.bubble blockquote{margin:8px 0;padding:8px 14px;border-left:3px solid var(--accent-400);background:rgba(63,151,227,.08);border-radius:0 10px 10px 0;color:var(--ink-700);}
.row.user .bubble blockquote{background:rgba(255,255,255,.16);border-left-color:#fff;color:#fff;}
.bubble .tbl-wrap{overflow-x:auto;margin:8px 0;border-radius:10px;border:1px solid var(--border);}
.bubble table{border-collapse:collapse;width:100%;font-size:13px;}
.bubble th,.bubble td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
.bubble th{background:var(--sky-100);font-family:'FGDisplay';font-weight:700;}
.bubble tr:last-child td{border-bottom:none;}
.row.user .bubble th,.row.user .bubble td{border-color:rgba(255,255,255,.28);}
.row.user .bubble th{background:rgba(255,255,255,.16);}
.bubble code.inline{
  font-family:'FGMono',monospace;font-weight:400;background:rgba(63,151,227,.12);padding:1px 6px;border-radius:5px;font-size:.89em;
}
.row.user .bubble code.inline{background:rgba(255,255,255,.22);}

.codeblock{margin:8px 0;border-radius:var(--r-md);overflow:hidden;border:1px solid #1c2f42;box-shadow:var(--shadow-2);}
.cb-head{display:flex;align-items:center;justify-content:space-between;background:#132234;padding:8px 12px;}
.cb-lang{font-size:11px;color:#8aa8c4;font-family:'FGThai';text-transform:uppercase;letter-spacing:.5px;}
.cb-copy{display:flex;align-items:center;gap:5px;font-size:11px;color:#cfe4fa;padding:4px 8px;border-radius:7px;font-family:'FGThai';}
.cb-copy:hover{background:rgba(255,255,255,.1);}
.cb-copy svg{width:12px;height:12px;}
.codeblock pre{margin:0;padding:13px 14px;overflow-x:auto;background:#0f1d2c;}
.codeblock code{font-family:'FGMono',monospace;font-size:12.5px;color:#dceeff;line-height:1.65;white-space:pre;}

.word-in{display:inline-block;animation:cloudIn .38s var(--ease) both;}
@keyframes cloudIn{from{opacity:0;transform:translateY(6px) scale(.94);filter:blur(2px);}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}}

.msg-meta{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--ink-400);font-family:'FGThai';padding:0 4px;}
.row.user .msg-meta{flex-direction:row-reverse;}

.think-row{display:flex;gap:11px;align-items:center;}
.think-cloud{width:52px;height:34px;position:relative;flex:0 0 52px;}
.think-cloud svg{width:100%;height:100%;}
.think-cloud .puff{animation:blinkPuff 1.3s ease-in-out infinite;transform-origin:center;}
.think-cloud .puff:nth-child(2){animation-delay:.15s;}
.think-cloud .puff:nth-child(3){animation-delay:.3s;}
.think-cloud .puff:nth-child(4){animation-delay:.45s;}
@keyframes blinkPuff{0%,100%{opacity:.35;transform:scale(.92);}50%{opacity:1;transform:scale(1.04);}}
.think-label{font-size:12px;color:var(--ink-500);font-family:'FGThai';}

.stage-trail{display:flex;flex-wrap:wrap;gap:6px;}
.stage-chip{
  display:flex;align-items:center;gap:5px;padding:5px 10px 5px 7px;border-radius:99px;
  background:rgba(63,151,227,.1);border:1px solid var(--border);font-size:11px;color:var(--ink-500);
  font-family:'FGThai';animation:chipIn .42s var(--ease) both;transform:rotate(var(--rot,0deg));
}
.stage-chip svg{width:12px;height:12px;flex:0 0 12px;color:var(--accent-500);}
.stage-trail.settled .stage-chip{background:var(--sky-100);opacity:.85;}
@keyframes chipIn{from{opacity:0;transform:translateY(10px) scale(.82) rotate(var(--rot,0deg));}to{opacity:1;transform:translateY(0) scale(1) rotate(var(--rot,0deg));}}

.ctx-menu{
  position:fixed;z-index:80;background:#fff;border-radius:var(--r-md);box-shadow:0 16px 40px -8px rgba(19,34,52,.35);
  border:1px solid var(--border);padding:6px;min-width:168px;opacity:0;transform:translateY(6px) scale(.96);
  transition:opacity .16s var(--ease),transform .16s var(--ease);pointer-events:none;
}
.ctx-menu.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.ctx-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:13px;font-family:'FGThai';color:var(--ink-700);width:100%;text-align:left;}
.ctx-item:hover{background:var(--sky-100);}
.ctx-item.danger{color:var(--danger);}
.ctx-item svg{width:15px;height:15px;flex:0 0 15px;}
#ctxScrim{position:fixed;inset:0;z-index:75;background:transparent;display:none;}

#composerWrap{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:12px 18px 18px;}
#composerWrap::before{content:"";position:absolute;inset:-30px 0 0;background:linear-gradient(180deg,transparent,var(--sky-50) 55%);pointer-events:none;z-index:-1;}
#composer{
  max-width:760px;margin:0 auto;background:rgba(255,255,255,.9);backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow-1);padding:9px 9px 9px 18px;
  display:flex;align-items:flex-end;gap:8px;transition:box-shadow .25s var(--ease),border-color .25s;
}
#composer:focus-within{border-color:var(--accent-400);box-shadow:0 12px 34px -10px rgba(63,151,227,.4);}
#composerEdit{
  display:none;max-width:760px;margin:0 auto 8px;background:var(--sky-100);border-radius:12px;padding:8px 12px;
  align-items:center;justify-content:space-between;font-size:11.5px;color:var(--accent-700);font-family:'FGThai';
}
#composerEdit button{color:var(--ink-500);}
#msgInput{
  flex:1;border:none;background:none;outline:none;resize:none;max-height:160px;padding:9px 2px;
  font-size:14.5px;line-height:1.6;color:var(--ink-900);font-family:'FGThaiBody','FGThai',sans-serif,var(--emoji);
}
#msgInput::placeholder{color:var(--ink-300);}
#sendBtn{
  width:42px;height:42px;flex:0 0 42px;border-radius:16px;background:linear-gradient(135deg,var(--accent-400),var(--accent-600));
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-2);
  transition:transform .16s var(--ease),opacity .2s;color:#fff;
}
#sendBtn:active{transform:scale(.92);}
#sendBtn:disabled{opacity:.4;pointer-events:none;}
#sendBtn svg{width:18px;height:18px;}
#stopBtn{
  width:42px;height:42px;flex:0 0 42px;border-radius:16px;background:var(--ink-900);display:none;
  align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow-2);
}
#stopBtn svg{width:14px;height:14px;}
#composerHint{max-width:760px;margin:8px auto 0;text-align:center;font-size:10.5px;color:var(--ink-300);font-family:'FGThai';}

#settingsPanel{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(15,35,55,.35);backdrop-filter:blur(3px);padding:20px;}
#settingsCard{background:#fff;border-radius:var(--r-xl);max-width:400px;width:100%;padding:22px;box-shadow:0 30px 70px -20px rgba(19,34,52,.4);}
#settingsCard h2{font-size:17px;margin-bottom:4px;}
#settingsCard .sc-sub{font-size:11.5px;color:var(--ink-500);font-family:'FGThai';margin-bottom:18px;}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border);}
.set-row:first-of-type{border-top:none;}
.set-label{font-size:13px;color:var(--ink-700);font-family:'FGThai';}
.set-label small{display:block;font-size:10.5px;color:var(--ink-400);margin-top:2px;}
.toggle{width:42px;height:24px;border-radius:99px;background:var(--sky-200);position:relative;transition:background .2s;flex:0 0 42px;}
.toggle.on{background:var(--accent-500);}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:99px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s var(--ease);}
.toggle.on::after{transform:translateX(18px);}
#closeSettings{width:100%;margin-top:16px;padding:12px;border-radius:var(--r-md);background:var(--sky-100);color:var(--accent-700);font-weight:700;font-size:13px;}

.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);z-index:100;
  background:var(--ink-900);color:#fff;padding:9px 16px 9px 9px;border-radius:99px;font-size:12.5px;font-family:'FGThai';
  box-shadow:0 14px 30px -8px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);
  display:flex;align-items:center;gap:9px;max-width:88vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast svg{width:14px;height:14px;flex:0 0 14px;margin-left:5px;}
.toast img.toast-ico{width:26px;height:26px;border-radius:9px;object-fit:cover;flex:0 0 26px;}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.artifact-card{
  margin:10px 0 2px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border);
  background:linear-gradient(180deg,#fff,var(--sky-50));box-shadow:var(--shadow-2);max-width:340px;
}

.row.user .af-chip{color:#fff;background:rgba(255,255,255,.2);}
.af-actions{display:flex;gap:8px;padding:0 13px 13px;}
.af-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 10px;border-radius:11px;font-size:12px;font-weight:700;font-family:'FGThai';transition:transform .16s var(--ease),opacity .2s;}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function inlineFormat(s){
  s = escapeHtml(s);
  const links = [];
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m,t,u) => { links.push(`<a href="${u}" target="_blank" rel="noopener">${t}</a>`); return `\u0000${links.length-1}\u0000`; });
  s = s.replace(/(https?:\/\/[^\s<]+)/g, (m) => { links.push(`<a href="${m}" target="_blank" rel="noopener">${m}</a>`); return `\u0000${links.length-1}\u0000`; });
  s = s.replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
  s = s.replace(/\*\*\*([^\*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/\*([^\*]+)\*/g, '<em>$1</em>');
  s = s.replace(/\u0000(\d+)\u0000/g, (m,i) => links[+i]);
  return s;
}

function renderTable(lines){
  const parseRow = l => l.replace(/^\||\|$/g,'').split('|').map(c => c.trim());
  if(lines.length < 2) return `<p>${inlineFormat(lines.join(' '))}</p>`;
  const header = parseRow(lines[0]);
  const sepValid = /^[\s\-:|]+$/.test(lines[1]);
  const bodyLines = sepValid ? lines.slice(2) : lines.slice(1);
  let html = '<div class="tbl-wrap"><table><thead><tr>' + header.map(h => `<th>${inlineFormat(h)}</th>`).join('') + '</tr></thead><tbody>';
  bodyLines.forEach(l => { html += '<tr>' + parseRow(l).map(c => `<td>${inlineFormat(c)}</td>`).join('') + '</tr>'; });
  html += '</tbody></table></div>';
  return html;
}

function renderBlock(block){
  const rawLines = block.split("\n");
  let html = "", i = 0, listBuffer = [], listType = null, paraBuffer = [], quoteBuffer = [];
  function flushList(){ if(listBuffer.length){ const tag = listType === 'ol' ? 'ol' : 'ul'; html += `<${tag}>` + listBuffer.map(li => `<li>${inlineFormat(li)}</li>`).join("") + `</${tag}>`; listBuffer = []; listType = null; } }
  function flushPara(){ if(paraBuffer.length){ html += `<p>${paraBuffer.map(inlineFormat).join("<br>")}</p>`; paraBuffer = []; } }
  function flushQuote(){ if(quoteBuffer.length){ html += `<blockquote>${quoteBuffer.map(inlineFormat).join("<br>")}</blockquote>`; quoteBuffer = []; } }
  while(i < rawLines.length){
    const trimmed = rawLines[i].trim();
    if(!trimmed.length){ flushList(); flushPara(); flushQuote(); i++; continue; }
    const h = trimmed.match(/^(#{1,4})\s+(.*)$/);
    if(h){ flushList(); flushPara(); flushQuote(); const lvl = h[1].length + 1; html += `<h${lvl}>${inlineFormat(h[2])}</h${lvl}>`; i++; continue; }
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)){ flushList(); flushPara(); flushQuote(); html += "<hr>"; i++; continue; }
    if(/^>\s?/.test(trimmed)){ flushList(); flushPara(); quoteBuffer.push(trimmed.replace(/^>\s?/,'')); i++; continue; }
    if(/^\|.*\|$/.test(trimmed)){
      flushList(); flushPara(); flushQuote();
      const tbl = [];
      while(i < rawLines.length && /^\|.*\|$/.test(rawLines[i].trim())){ tbl.push(rawLines[i].trim()); i++; }
      html += renderTable(tbl);
      continue;
    }
    if(/^[-*+]\s+/.test(trimmed)){ flushPara(); flushQuote(); if(listType && listType !== 'ul') flushList(); listType = 'ul'; listBuffer.push(trimmed.replace(/^[-*+]\s+/,'')); i++; continue; }
    if(/^\d+[\.\)]\s+/.test(trimmed)){ flushPara(); flushQuote(); if(listType && listType !== 'ol') flushList(); listType = 'ol'; listBuffer.push(trimmed.replace(/^\d+[\.\)]\s+/,'')); i++; continue; }
    flushList(); flushQuote();
    paraBuffer.push(trimmed);
    i++;
  }
  flushList(); flushPara(); flushQuote();
  return html;
}

function renderMarkdown(text){
  const blocks = text.split(/```/g);
  let html = "";
  blocks.forEach((block, i) => {
    if(i % 2 === 1){
      const lines = block.split("\n");
      let lang = lines[0].trim();
      let code = lines.slice(1).join("\n");
      if(!lang){ lang = "text"; code = lines.join("\n"); }
      if(code.endsWith("\n")) code = code.slice(0,-1);
      html += `<div class="codeblock"><div class="cb-head"><span class="cb-lang">${escapeHtml(lang)}</span><button class="cb-copy" data-code="${encodeURIComponent(code)}">${svgCopy}<span>คัดลอก</span></button></div><pre><code>${escapeHtml(code)}</code></pre></div>`;
    } else {
      block.split(/\n{2,}/).filter(b => b.trim().length).forEach(b => { html += renderBlock(b); });
    }
  });
  return html || "<p></p>";
}

const EXT_MAP = {
  html:'index.html', htm:'index.html', svg:'image.svg', css:'style.css',
  js:'script.js', javascript:'script.js', jsx:'App.jsx', ts:'script.ts', tsx:'App.tsx',
  json:'data.json', py:'main.py', python:'main.py', sh:'script.sh', bash:'script.sh',
  sql:'query.sql', md:'notes.md', yaml:'config.yaml', yml:'config.yaml', xml:'data.xml',
  txt:'file.txt'
};
const PREVIEWABLE = new Set(['html','htm','svg']);

function extractCodeFences(text){
  const re = /```([a-zA-Z0-9_+-]*)(?::([^\n`]+))?\n([\s\S]*?)```/g;
  const files = [];
  const usedNames = new Map();
  let m;
  while((m = re.exec(text)) !== null){
    let lang = (m[1] || 'txt').toLowerCase();
    let code = m[3];
    if(code.endsWith('\n')) code = code.slice(0,-1);
    if(!code.trim()) continue;
    let name = (m[2] || '').trim();
    if(!name){
      const base = EXT_MAP[lang] || ('file.' + (lang || 'txt'));
      const count = usedNames.get(base) || 0;
      usedNames.set(base, count + 1);
      if(count === 0){ name = base; }
      else {
        const dot = base.lastIndexOf('.');
        name = dot > -1 ? base.slice(0,dot) + (count+1) + base.slice(dot) : base + (count+1);
      }
    }
    files.push({ lang, name, code });
  }
  return files;
}

function fileIconLabel(files){
  if(files.length === 1) return files[0].name;
  return files.length + ' ไฟล์';
}

function buildArtifactCard(content, role){
  const files = extractCodeFences(content || '');
  if(!files.length) return null;
  const card = document.createElement('div');
  card.className = 'artifact-card';
  const totalBytes = files.reduce((a,f) => a + f.code.length, 0);
  const sizeLabel = totalBytes > 1024 ? (totalBytes/1024).toFixed(1)+' KB' : totalBytes + ' B';
  const previewFile = files.find(f => PREVIEWABLE.has(f.lang));
  card.innerHTML = `
    <div class="af-head">
      <div class="af-icon">${svgFile}</div>
      <div class="af-meta">
        <div class="af-title">${escapeHtml(fileIconLabel(files))}</div>
        <div class="af-sub">${files.length} ไฟล์ · ${sizeLabel}</div>
      </div>
    </div>
    <div class="af-files">${files.map(f => `<span class="af-chip">${escapeHtml(f.name)}</span>`).join('')}</div>
    <div class="af-actions">
      ${previewFile ? `<button class="af-btn ghost" data-act="preview">${svgEye}<span>ดูตัวอย่าง</span></button>` : ''}
      <button class="af-btn primary" data-act="download">${svgDownload}<span>ดาวน์โหลด ZIP</span></button>
    </div>`;
  const dlBtn = card.querySelector('[data-act="download"]');
  dlBtn.addEventListener('click', () => downloadArtifactZip(files));
  const pvBtn = card.querySelector('[data-act="preview"]');
  if(pvBtn){ pvBtn.addEventListener('click', () => openArtifactPreview(previewFile)); }
  return card;
}

async function downloadArtifactZip(files){
  try{
    const zip = new JSZip();
    files.forEach(f => zip.file(f.name, f.code));
    const blob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'cordy-' + Date.now().toString(36) + '.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    showToast(svgCheck, 'ดาวน์โหลดไฟล์แล้ว');
  }catch(e){
    showToast(svgWarn, 'ดาวน์โหลดไฟล์ไม่สำเร็จ');
  }
}

function bindCodeCopy(bubble){
  bubble.querySelectorAll('.cb-copy').forEach(btn => {
    btn.addEventListener('click', () => {
      const code = decodeURIComponent(btn.dataset.code);
      navigator.clipboard.writeText(code).then(() => {
        const span = btn.querySelector('span');
        const prev = span.textContent;
        span.textContent = 'คัดลอกแล้ว';
        setTimeout(() => span.textContent = prev, 1400);
      });
    });
  });
}

function bindPressHold(bubble, row, index, meta){
  let firedMenu = false;
  const start = (e) => {
    firedMenu = false;
    pressTimer = setTimeout(() => {
      firedMenu = true;
      bubble.classList.add('pressed');
      openCtxMenu(bubble, row.classList.contains('user') ? 'user' : 'assistant', index, meta);
    }, 430);
  };
  const cancel = () => { clearTimeout(pressTimer); };
  bubble.addEventListener('mousedown', start);
  bubble.addEventListener('mouseup', cancel);
  bubble.addEventListener('mouseleave', cancel);
  bubble.addEventListener('touchstart', start, {passive:true});
  bubble.addEventListener('touchend', cancel);
  bubble.addEventListener('touchmove', cancel);
  bubble.addEventListener('contextmenu', (e) => { e.preventDefault(); });
}

function openCtxMenu(bubble, role, index, meta){
  const menu = el('ctxMenu');
  ctxTarget = { bubble, role, index, meta };
  let html = `<button class="ctx-item" data-act="copy">${svgCopy}คัดลอกข้อความ</button>`;
  if(role === 'user'){
    html += `<button class="ctx-item" data-act="edit">${svgEdit}แก้ไขและส่งใหม่</button>`;
  } else {
    html += `<button class="ctx-item" data-act="regen">${svgRegen}สร้างคำตอบใหม่</button>`;
  }
  html += `<button class="ctx-item danger" data-act="del">${svgDel}ลบข้อความนี้</button>`;
  menu.innerHTML = html;

  const rect = bubble.getBoundingClientRect();
  const menuW = 190;
  const menuH = role === 'user' ? 118 : 150;
  let left = rect.left + rect.width/2 - menuW/2;
  left = Math.max(10, Math.min(left, window.innerWidth - menuW - 10));
  menu.style.left = left + 'px';
  if(rect.top - menuH - 14 > 0){
    menu.style.top = (rect.top - 8 - menuH) + 'px';
  } else {
    menu.style.top = (rect.bottom + 8) + 'px';
  }

  el('ctxScrim').style.display = 'block';
  requestAnimationFrame(() => menu.classList.add('show'));

  menu.querySelectorAll('.ctx-item').forEach(btn => {
    btn.onclick = () => { handleCtxAction(btn.dataset.act); closeCtxMenu(); };
  });
}

function closeCtxMenu(){
  el('ctxMenu').classList.remove('show');
  el('ctxScrim').style.display = 'none';
  el('ctxMenu').style.transform = '';
  document.querySelectorAll('.bubble.pressed').forEach(b => b.classList.remove('pressed'));
}

function handleCtxAction(act){
  if(!ctxTarget) return;
  const chat = activeChat();
  const { index, role, meta } = ctxTarget;
  const msg = chat.messages[index];
  if(act === 'copy'){
    navigator.clipboard.writeText(msg.content).then(() => {
      showToast(svgCheck, 'คัดลอกข้อความแล้ว');
    });
  } else if(act === 'edit'){
    msgInput.value = msg.content;
    autoGrow();
    msgInput.focus();
    el('composerEdit').style.display = 'flex';
    el('composerEdit').dataset.editIndex = index;
  } else if(act === 'regen'){
    regenerateFrom(index);
  } else if(act === 'del'){
    chat.messages.splice(index, 1);
    saveStore();
    renderMessages();
  }
}

function regenerateFrom(index){
  const chat = activeChat();
  if(chat.messages[index].role !== 'assistant') return;
  chat.messages.splice(index, 1);
  saveStore();
  renderMessages();
  streamAssistant(chat);
}

function nextSuggestions(n){
  if(suggestBag.length < n){
    const idx = SUGGESTIONS.map((_,i) => i);
    for(let i = idx.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [idx[i],idx[j]] = [idx[j],idx[i]]; }
    suggestBag = suggestBag.concat(idx);
  }
  const picked = suggestBag.splice(0, n);
  saveBag();
  return picked.map(i => SUGGESTIONS[i]);
}

function renderSuggestGrid(){
  const grid = el('suggestGrid');
  if(!grid) return;
  grid.innerHTML = "";
  nextSuggestions(4).forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'suggest-card';
    btn.style.animationDelay = (i*0.05)+'s';
    btn.dataset.p = s.p;
    btn.innerHTML = `<b>${s.b}</b>${s.d}`;
    btn.addEventListener('click', () => { msgInput.value = s.p; autoGrow(); submitMessage(); });
    grid.appendChild(btn);
  });
}

function renderMessages(){
  msgWrap.innerHTML = "";

  if(!chat || chat.messages.length === 0){
    msgWrap.appendChild(emptyState);
    emptyState.style.display = 'flex';
    renderSuggestGrid();
    updateNewChatBtnState();

  chat.messages.forEach((m, i) => msgWrap.appendChild(buildRow(m, i)));

  updateNewChatBtnState();

  toast.querySelector('span').textContent = text;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2600);
}

function playSound(id){

  const a = el(id);

  a.play().catch(()=>{});

function autoGrow(){
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 160) + 'px';
  sendBtn.disabled = msgInput.value.trim().length === 0 || streaming;
}
msgInput.addEventListener('input', autoGrow);
msgInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    submitMessage();
  }
});

function ensureChat(){
  if(!activeChat()){ newChat(); }
  return activeChat();
}

function submitMessage(){
  const text = msgInput.value.trim();
  if(!text || streaming) return;
  const chat = ensureChat();

  const editIdx = el('composerEdit').dataset.editIndex;
  if(el('composerEdit').style.display === 'flex' && editIdx !== undefined){
    chat.messages = chat.messages.slice(0, parseInt(editIdx));
    el('composerEdit').style.display = 'none';
    delete el('composerEdit').dataset.editIndex;
  }

  if(chat.messages.length === 0){
    chat.title = text.slice(0, 28) + (text.length > 28 ? '…' : '');
  }
  chat.messages.push({ role: 'user', content: text, ts: Date.now() });
  msgInput.value = '';
  autoGrow();
  saveStore();
  renderChatList();
  renderMessages();
  playSound('sndStart');
  streamAssistant(chat);
}

    <div class="avatar"><img src="./CordyAI.webp" alt=""></div>
    <div class="bubble-col">
      <div class="stage-trail" id="stageTrail"></div>
      <div class="think-row">
        <div class="think-cloud">
          <svg viewBox="0 0 60 40" fill="none">
            <ellipse class="puff" cx="18" cy="24" rx="12" ry="10" fill="#aed4f6"/>
            <ellipse class="puff" cx="30" cy="16" rx="14" ry="12" fill="#8fc3f2"/>
            <ellipse class="puff" cx="42" cy="24" rx="12" ry="10" fill="#aed4f6"/>
            <ellipse class="puff" cx="30" cy="27" rx="20" ry="10" fill="#3f97e3"/>
          </svg>
        </div>
        <div class="think-label" id="thinkLabel">Cordy กำลังคิด...</div>
      </div>
    </div>`;
  msgWrap.appendChild(row);
  scrollToBottom();
}
function removeThinkingRow(){ el('thinkRow')?.remove(); }

function addStage(type){
  const trail = el('stageTrail');
  if(!trail) return;
  const info = stageInfo(type);
  const chip = document.createElement('div');
  chip.className = 'stage-chip';
  chip.style.setProperty('--rot', (Math.random()*6-3).toFixed(1)+'deg');
  chip.innerHTML = info.icon + '<span>' + info.label + '</span>';
  trail.appendChild(chip);
  const lbl = el('thinkLabel');
  if(lbl) lbl.textContent = 'Cordy กำลัง' + info.label + '...';
  scrollToBottom();
}

async function streamAssistant(chat){
  setStreamingUI(true);
  appendThinkingRow();
  abortCtrl = new AbortController();

  const payload = {
    messages: chat.messages.map(m => ({ role: m.role, content: m.content }))
  };

  let full = "";
  let rowBuilt = false;
  let bubbleEl = null;

  try{
    const res = await fetch(CORDY_BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: abortCtrl.signal
    });

    if(!res.ok || !res.body){
      throw new Error('bad_response');
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for(const line of lines){
        const t = line.trim();
        if(!t.startsWith('data:')) continue;
        const data = t.slice(5).trim();
        if(data === '[DONE]') continue;
        try{
          const json = JSON.parse(data);
          if(json.stage){
            addStage(json.stage);
            continue;
          }
          const delta = json.delta || "";
          if(delta){
            if(!rowBuilt){
              const strayTrail = el('stageTrail');
              let capturedTrail = null;
              if(strayTrail && strayTrail.children.length){
                capturedTrail = strayTrail;
                capturedTrail.removeAttribute('id');
                capturedTrail.classList.add('settled');
              }
              removeThinkingRow();
              chat.messages.push({ role: 'assistant', content: '', ts: Date.now() });
              const row = buildRow(chat.messages[chat.messages.length-1], chat.messages.length-1);
              msgWrap.appendChild(row);
              bubbleEl = row.querySelector('.bubble');
              if(capturedTrail){ bubbleEl.parentElement.insertBefore(capturedTrail, bubbleEl); }
              rowBuilt = true;
            }
            full += delta;
            chat.messages[chat.messages.length-1].content = full;
            renderStreamChunk(bubbleEl, delta, full);
            scrollToBottom();
          }
          if(json.error){
            throw new Error('stream_error');
          }
        }catch(e){ if(e.message !== 'stream_error') continue; else throw e; }
      }
    }

    if(!rowBuilt){
      throw new Error('empty_response');
    }
    saveStore();
    renderMessages();
    playSound('sndEnd');
  } catch(err){
    removeThinkingRow();
    if(err.name === 'AbortError'){
      if(!full){ }
    } else {
      playSound('sndError');
      if(!rowBuilt){
        chat.messages.push({ role: 'assistant', content: 'ตอนนี้มีผู้ใช้งาน Cordy พร้อมกันเป็นจำนวนมาก ระบบเลยตอบช้าไปหน่อยครับ ลองส่งข้อความอีกครั้งใน 1-2 นาทีนะครับ 🙏', ts: Date.now() });
        renderMessages();
      }
      showToast('<img class="toast-ico" src="./CordyBad.webp" alt="">', 'เกิดข้อผิดพลาด กรุณาลองใหม่');
    }
    saveStore();
  } finally {
    setStreamingUI(false);
    renderChatList();
  }
}

function renderStreamChunk(bubbleEl, delta, full){
  bubbleEl.innerHTML = renderMarkdown(full);
  bindCodeCopy(bubbleEl);
  if(!settings.anim) return;
  const spans = bubbleEl.querySelectorAll('p, li, h1, h2, h3, h4, h5');
  if(spans.length){
    const last = spans[spans.length-1];
    last.classList.add('word-in');
    requestAnimationFrame(()=> last.classList.remove('word-in'));
  }
}

el('menuBtn').addEventListener('click', () => {
  el('sidebar').classList.toggle('open');
  el('sidebarScrim').classList.toggle('show');
});
el('sidebarScrim').addEventListener('click', closeSidebarMobile);
function closeSidebarMobile(){
  if(window.innerWidth <= 860){
    el('sidebar').classList.remove('open');
    el('sidebarScrim').classList.remove('show');
  }
}

el('newChatBtn').addEventListener('click', () => {
  const cur = activeChat();
  if(cur && cur.messages.length === 0 && state.chats.length > 0){
    showToast(svgWarn, 'คุณมีแชทใหม่รออยู่แล้ว ลองคุยก่อนนะครับ');
    closeSidebarMobile();
    return;
  }
  newChat();
  closeSidebarMobile();
});
el('clearAllBtn').addEventListener('click', () => {
  if(confirm('ต้องการลบแชททั้งหมดใช่หรือไม่?')){
    state.chats = [];
    state.activeId = null;
    saveStore();
    renderChatList();
    renderMessages();
  }
});

el('openSettingsBtn').addEventListener('click', () => { el('settingsPanel').style.display = 'flex'; });
el('closeSettings').addEventListener('click', () => { el('settingsPanel').style.display = 'none'; });
el('soundToggle').addEventListener('click', function(){
  settings.sound = !settings.sound;
  this.classList.toggle('on', settings.sound);
  syncSoundBtn();
  saveSettings();
});
el('animToggle').addEventListener('click', function(){
  settings.anim = !settings.anim;
  this.classList.toggle('on', settings.anim);
  saveSettings();
});
el('soundBtn').addEventListener('click', () => {
  settings.sound = !settings.sound;
  el('soundToggle').classList.toggle('on', settings.sound);
  syncSoundBtn();
  saveSettings();
});
function syncSoundBtn(){
  el('soundIconOn').style.display = settings.sound ? 'block' : 'none';
  el('soundIconOff').style.display = settings.sound ? 'none' : 'block';
}

window.addEventListener('offline', () => {
  showToast('<img class="toast-ico" src="./CordyBad.webp" alt="">', 'ขาดการเชื่อมต่ออินเทอร์เน็ต');
});
window.addEventListener('online', () => {
  showToast('<img class="toast-ico" src="./CordyGood.webp" alt="">', 'เชื่อมต่ออินเทอร์เน็ตกลับมาแล้ว');
});

document.addEventListener('contextmenu', (e) => {
  if(e.target.closest('.selectable, #msgInput, .bubble, .codeblock')) return;
  e.preventDefault();
});
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if(k === 'f12'){ e.preventDefault(); }
  if(e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')){ e.preventDefault(); }
  if(e.ctrlKey && k === 'u'){ e.preventDefault(); }
  if(e.metaKey && e.altKey && k === 'i'){ e.preventDefault(); }
});
document.querySelectorAll('.bubble, .codeblock, #msgInput').forEach(n => n.classList?.add('selectable'));
document.body.addEventListener('dragstart', (e) => { if(e.target.tagName === 'IMG') e.preventDefault(); });

function init(){
  loadStore();
  el('soundToggle').classList.toggle('on', settings.sound);
  el('animToggle').classList.toggle('on', settings.anim);
  syncSoundBtn();
  if(state.chats.length === 0){ newChat(); }
  else { renderChatList(); renderMessages(); }
  autoGrow();
  if(!navigator.onLine){ showToast('<img class="toast-ico" src="./CordyBad.webp" alt="">', 'ขาดการเชื่อมต่ออินเทอร์เน็ต'); }
}
init();
</script>
